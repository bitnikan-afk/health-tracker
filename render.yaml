# Render инфраструктура
# Web Service — сервер
services:
  - type: web
    name: health-tracker-api
    runtime: image
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        value: postgresql://health_tracker_db_v77g_user:mPf7COrFV9WK4L8CiDqDC9CK0GWfEcW6@dpg-d7r5bpf7f7vs73codg60-a/health_tracker_db_v77g
      - key: JWT_SECRET
        value: health-tracker-secret-key-2026
      - key: DEEPSEEK_API_KEY
        value: sk-764fffe94cdc4b3fb3e4ba84976a4411
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://health-tracker.onrender.com

# Static Site — клиент
  - type: static
    name: health-tracker
    publishDir: ./client
    staticPublishPath: ./
    buildCommand: ""
    routes:
      - type: rewrite
        source: /api/*
        destination: https://health-tracker-api.onrender.com/api/:splat
      - type: rewrite
        source: /socket.io/*
        destination: https://health-tracker-api.onrender.com/socket.io/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: no-cache
